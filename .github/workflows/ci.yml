name: CI

# 触发：推送到主分支、以及所有 PR。
# 不在文档-only 的改动上跑全部测试（省时间），但 .md 改动仍会跑一次构建以保证不破坏编译。
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 同一分支的新推送取消上一次未跑完的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # ABP 10.6 依赖 EF Core 10.0.9，见 Directory.Build.props 里的说明
  DOTNET_VERSION: '10.0.x'

jobs:
  backend:
    name: 后端（构建 / 单元测试 / 集成测试 / Swagger 冒烟）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xjgl_test
          POSTGRES_USER: xjgl
          POSTGRES_PASSWORD: Xjgl@Dev2026
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xjgl -d xjgl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # 集成测试与 DbMigrator 都读这个连接串
      ConnectionStrings__Default: "Host=127.0.0.1;Port=5432;Database=xjgl_test;User ID=xjgl;Password=Xjgl@Dev2026;Timeout=30;Command Timeout=120"
      XJGL_TEST_CONNECTION: "Host=127.0.0.1;Port=5432;Database=xjgl_test;User ID=xjgl;Password=Xjgl@Dev2026;Timeout=30;Command Timeout=120"

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 还原与构建
        run: dotnet build Xjgl.sln -c Release

      # PDF 渲染（学籍卡/花名册）会真的画中文，镜像里没有中文字体就会因"缺少字形"失败。
      # 这不是测试太脆，而是真实反映"部署环境缺字体就打不出学籍卡"——
      # 生产环境同样需要装字体（见 README 的已知限制）。
      - name: 安装中文字体（PDF 渲染需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # 集成测试打真实数据库，因此必须先建表与种子数据。
      # DbMigrator 是幂等的，重复执行不会产生脏数据。
      - name: 初始化数据库（迁移 + 种子）
        run: dotnet run --project src/Xjgl.DbMigrator -c Release --no-build

      - name: 单元测试（不依赖数据库）
        env:
          XJGL_PRINT_FONT: Noto Sans CJK SC
        run: dotnet run --project test/Xjgl.Domain.Tests -c Release --no-build

      - name: 集成测试（真实 PostgreSQL）
        env:
          XJGL_PRINT_FONT: Noto Sans CJK SC
        run: dotnet run --project test/Xjgl.Application.Tests -c Release --no-build

      # 这一条是为了守住一个真实踩过的缺陷：某个接口的参数元数据无法被 SwaggerGen
      # 处理时，**整个 swagger.json 会生成失败（500）**，所有接口的文档一起消失，
      # 而接口本身调用完全正常 —— 只有真的去请求一次才会发现。
      #
      # 顺带用生成出来的真实路由表核对前端每次调用的路径与动词：
      # ABP 按方法名前缀决定 HTTP 动词（不以 Get* 开头的一律 POST），
      # 「导出」「批量删除」这类接口很容易前后端动词对不上，线上表现是 405 而不是 404，
      # 进程内单元测试完全发现不了。详见 tools/audit-routes.mjs 顶部的说明。
      - name: Swagger 冒烟 + 前端路由核对
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:44300
        run: |
          dotnet run --project src/Xjgl.HttpApi.Host -c Release --no-build &
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o swagger.json -w "%{http_code}" http://127.0.0.1:44300/swagger/v1/swagger.json || true)
            if [ "$code" = "200" ]; then
              echo "✅ swagger.json 生成成功"
              break
            fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "❌ swagger.json 未能生成（最后一次 HTTP $code）"
            echo "常见原因：[FromForm] 用在了 IFormFile 上，或存在路由冲突导致 SwaggerGen 抛异常。"
            exit 1
          fi
          node tools/audit-routes.mjs swagger.json

  frontend:
    name: 前端（类型检查 / 生产构建）
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 启用 corepack（pnpm 版本由 web/package.json 的 packageManager 固定）
        run: corepack enable

      - name: 缓存 pnpm 存储
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 安装依赖（使用锁文件）
        run: corepack pnpm@9.15.0 install --frozen-lockfile

      - name: 类型检查
        run: corepack pnpm@9.15.0 --filter @xjgl/pc run typecheck

      - name: 生产构建
        run: corepack pnpm@9.15.0 --filter @xjgl/pc run build

  deploy:
    name: 部署编排（语法 + 与应用配置的一致性）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 用 docker 自己的解析器校验 compose 的语法与变量插值：
      # `${VAR:?提示}` 这类写法只有真解析一遍才知道变量齐不齐
      - name: 校验 compose 语法与变量插值
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env config -q

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 以 appsettings.json 为事实来源，核对 compose 是否提供了应用需要的全部环境变量，
      # 并检查字体、健康检查、数据卷、nginx 的深链回落与上传体积等（详见脚本注释）
      - name: 核对部署配置与应用期望是否一致
        run: node tools/verify-deploy.mjs

  e2e:
    name: 端到端流程测试（Playwright + Chromium）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xjgl_test
          POSTGRES_USER: xjgl
          POSTGRES_PASSWORD: Xjgl@Dev2026
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xjgl -d xjgl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_VERSION: '10.0.x'
      # 迁移器与后端 Host 都读这个连接串。
      # 【为什么必须显式给】appsettings.json 里的默认值是"本机 PostgreSQL 的 xjgl 库"，
      # 而 CI 里服务容器的库叫 xjgl_test，不给这个变量迁移器就会去连一个不存在的库。
      ConnectionStrings__Default: "Host=127.0.0.1;Port=5432;Database=xjgl_test;User ID=xjgl;Password=Xjgl@Dev2026;Timeout=30;Command Timeout=120"
      # Playwright 的配置会用这个连接串启动后端 Host（两者取值相同，语义各自独立）
      E2E_DB_CONNECTION: "Host=127.0.0.1;Port=5432;Database=xjgl_test;User ID=xjgl;Password=Xjgl@Dev2026;Timeout=30;Command Timeout=120"
      E2E_DOTNET_CONFIG: Release
      # 中文字体：打印用例会真的渲染 PDF（缺字形会直接失败，这正是生产环境会遇到的问题）。
      # appsettings 里的默认字体族是"微软雅黑"（Windows 才有），CI 装的是 Noto，因此在这里覆盖。
      XJGL_PRINT_FONT: Noto Sans CJK SC
      Xjgl__Print__DefaultFontFamily: Noto Sans CJK SC

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 构建后端
        run: dotnet build Xjgl.sln -c Release

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 初始化数据库
        run: dotnet run --project src/Xjgl.DbMigrator -c Release --no-build

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 启用 corepack
        run: corepack enable

      - name: 缓存 pnpm 存储
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 安装前端依赖
        working-directory: web
        run: corepack pnpm@9.15.0 install --frozen-lockfile

      - name: 安装 Chromium（含系统依赖）
        working-directory: web
        run: corepack pnpm@9.15.0 exec playwright install --with-deps chromium

      # 后端与前端 dev server 都由 Playwright 的 webServer 配置拉起
      # （后端我这边用 E2E_DB_CONNECTION 指到 CI 的 postgres 服务）
      - name: 端到端流程测试
        working-directory: web
        run: corepack pnpm@9.15.0 exec playwright test --config e2e/playwright.config.ts

      - name: 上传失败现场（截图 / 录屏 / 追踪）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          retention-days: 7
