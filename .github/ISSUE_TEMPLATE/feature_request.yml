name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前建议先看一眼 [`ROADMAP.md`](../../ROADMAP.md) ——
        待办都已经拆成可认领的条目，也许你要的已经在里面。
        另外 ROADMAP 末尾有一节「非目标（明确不做）」，
        例如 BPMN 引擎、并行审批、多租户都不在计划内。

  - type: textarea
    id: problem
    attributes:
      label: 你要解决什么问题
      description: |
        **请先讲问题，不要先讲方案。** 这是本项目最看重的部分 ——
        很多"功能需求"背后其实是一个流程问题，换一种做法就不需要这个功能。
      placeholder: |
        例如：县区管理员反映，他们每学期要手工统计"哪些学校还没交照片"，
        得逐个学校点进去看，30 所学校要花一个下午。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 如果你已经有想法，说一下；没有也可以只填上一栏。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 例如"用现有的导出功能自己做"，以及为什么不够用。
    validations:
      required: false

  - type: dropdown
    id: who
    attributes:
      label: 这个需求主要服务于谁
      multiple: true
      options:
        - 省厅管理员
        - 市 / 县区管理员
        - 学校管理员 / 学籍管理员
        - 班主任 / 普通教师
        - 系统运维
        - 二次开发者
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 你是否愿意参与实现
      options:
        - label: 我愿意提 PR 实现它（维护者会先和你确认方案）
        - label: 我可以帮忙测试
        - label: 我只是提建议，实现需要由维护者安排
