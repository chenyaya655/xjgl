# 河南省学籍管理系统 —— 单节点冒烟用的 PostgreSQL
#
# ⚠ 同 namespace.yaml 顶部声明：本目录清单**从未在真实集群上应用过**。
#
# ---------------------------------------------------------------------------
# 【生产上不该这么部署】
# 应用与数据库同集群、同命名空间、单副本 StatefulSet、没有备份策略 ——
# 这在生产上是不合格的。这个文件存在的唯一理由是：
# ROADMAP 第 14 条的验收标准要求"在**任意单节点 K8s** 上**完整部署**并跑通冒烟"，
# 而冒烟需要一套能连的数据库。用托管 PG / 已有的 PG 时，
# 把这个文件（连同 redis.yaml）删掉，只改 ConfigMap/Secret 里的地址即可。
#
# 与 `deploy/docker-compose.prod.yml` 的 postgres 服务逐项对齐，两处**刻意**一致：
#   - `POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8`：
#     中文与生僻字的排序、LIKE 行为依赖它，而且**建库之后再改很麻烦**
#     （要 pg_dump + 重建，见 docs/articles/03-生僻字全链路-不出现方块.md 第三节）；
#   - `max_connections=200`、`shared_preload_libraries=pg_stat_statements`、
#     `log_min_duration_statement=1000`：与 compose 里的启动参数相同；
#   - `docker-entrypoint-initdb.d` 里挂的是仓库里那份扩展脚本的副本。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 初始化 SQL（只在数据目录为空时执行一次）
#
# ⚠ **事实来源是 `deploy/initdb/01-extensions.sql`**，这里是它的副本。
#   之所以不直接引用文件（k8s 的 ConfigMap 不能从宿主机路径动态挂载），
#   代价就是"两处可能漂移"。`tools/verify-deploy.mjs` 会核对这两处的
#   SQL 内容是否一致 —— 改了一处忘了另一处，那个脚本会红。
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: xjgl-postgres-initdb
  namespace: xjgl
  labels:
    app.kubernetes.io/name: xjgl
    app.kubernetes.io/component: postgres
data:
  01-extensions.sql: |
    -- ===========================================================================
    --  学籍管理系统 —— 数据库初始化脚本
    --  由 docker-entrypoint-initdb.d 在容器首次启动（数据卷为空）时自动执行。
    --  注意：只在初始化时跑一次；后续修改请写成迁移脚本。
    -- ===========================================================================

    -- 性能观测：慢 SQL 统计
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

    -- 姓名模糊检索（生僻字按原样匹配，不依赖拼音）
    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    -- UUID 生成
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    -- 去音标/变音符号，便于姓名与地名的宽松匹配
    CREATE EXTENSION IF NOT EXISTS unaccent;

    -- ---------------------------------------------------------------------------
    -- 中文 ICU 排序规则
    --   PostgreSQL 内置的 zh-x-icu 可用于按中文习惯排序；
    --   这里再建一个显式命名的排序规则，业务表可按需引用：
    --       ORDER BY student_name COLLATE zh_icu
    --   注意：生僻字（CJK 扩展 B 区及以上）在 ICU 里的排序位置由 ICU 版本决定，
    --   因此学籍系统列表默认按“学校 + 年级班级 + 学籍辅号”排序，不按姓名排序。
    -- ---------------------------------------------------------------------------
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_collation WHERE collname = 'zh_icu') THEN
            CREATE COLLATION zh_icu (provider = icu, locale = 'zh-CN');
        END IF;
    END
    $$;

    -- 确认扩展已就绪（输出会出现在 docker logs 里）
    SELECT extname, extversion FROM pg_extension ORDER BY extname;
---
# ---------------------------------------------------------------------------
# PostgreSQL 本体
#
# 【为什么用 StatefulSet 而不是 Deployment】
# 想要"每个副本自己的 PV"就得用 volumeClaimTemplates，而它是 StatefulSet 的能力。
# 这里 replicas=1，看起来用 Deployment + 普通 PVC 也行 —— 但换存储类/扩容时
# StatefulSet 的语义更贴近"数据库"这个东西，代价只是多一个 headless 之外的 Service。
#
# 【口令只有一处】
# POSTGRES_PASSWORD 从 Secret 取；api 那边的连接串由 `$(POSTGRES_PASSWORD)` 展开拼出
# （见 api-deployment.yaml）。所以改口令只需要改 Secret 一处。
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: xjgl
  labels:
    app.kubernetes.io/name: xjgl
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: xjgl-postgres
  template:
    metadata:
      labels:
        app: xjgl-postgres
        app.kubernetes.io/name: xjgl
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # 库名/用户名是**明文**的（不是口令），但仍与 api 的连接串里那两处
            # 保持一致：Database=xjgl / User ID=xjgl
            - name: POSTGRES_DB
              value: "xjgl"
            - name: POSTGRES_USER
              value: "xjgl"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xjgl-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=C.UTF-8"
            - name: TZ
              value: "Asia/Shanghai"
          # 与 compose 的 command 一一对应：参数写错不会报错，只会"行为悄悄变了"
          # （比如少了 C.UTF-8，排序在中文上就不符合预期）
          args:
            - postgres
            - -c
            - max_connections=200
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - log_min_duration_statement=1000
            - -c
            - timezone=Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              # 这里**故意不查具体库**：数据库还在恢复时 pg_isready 退非 0，
              # 但"进程活着"与"这个库能连"是两件事，liveness 只该判前者
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # 没压测过（deploy/README.md 第 12 章）；生产上要按实际数据量调
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: initdb
          configMap:
            name: xjgl-postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        # ⚠ 必须替换成现场实际存在的存储类（kubectl get storageclass）。
        #   k3s 自带的是 local-path。
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
---
# ---------------------------------------------------------------------------
# 数据库 Service
#
# 名字必须是 `postgres`：api 的连接串里写的是 `Host=postgres`。
# 生产上如果换成托管数据库，改的是连接串，不是这里。
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: xjgl
  labels:
    app.kubernetes.io/name: xjgl
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app: xjgl-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
