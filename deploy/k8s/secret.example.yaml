# 河南省学籍管理系统 —— 口令示例（Secret，**只是示例，不要直接 apply**）
#
# ⚠ 同 namespace.yaml 顶部声明：本目录清单**从未在真实集群上应用过**。
#
# ---------------------------------------------------------------------------
# 【这个文件是模板，不是可用的 Secret】
#
# 里面的值全是占位符（`请改成强口令`）。真正的做法有两种，README 里给了可直接
# 复制粘贴的命令：
#
#   方式一（推荐）：用 kubectl 创建，口令不进任何文件、也不进 git 历史
#     kubectl -n xjgl create secret generic xjgl-secret \
#       --from-literal=POSTGRES_PASSWORD='<强口令>' \
#       --from-literal=REDIS_PASSWORD='<强口令>'
#
#   方式二：把本文件复制成 `secret.yaml`（**已被 .gitignore 忽略？没有 —— 所以
#     千万别提交**），改成真实口令后 `kubectl apply -f secret.yaml`。
#
# ---------------------------------------------------------------------------
# 【为什么 Secret 里放的是 POSTGRES_PASSWORD / REDIS_PASSWORD，
#   而不是 ConnectionStrings__Default / Redis__Password】
#
# 与 compose 里的 `${POSTGRES_PASSWORD}` 是同一个目的：**口令只写一处**。
#   - 数据库连接串在 api-deployment.yaml 里用 `$(POSTGRES_PASSWORD)` 展开拼出来
#     （compose 用 `${POSTGRES_PASSWORD}` 插值，k8s 用 `$(VAR)`）；
#   - Redis 口令在 api-deployment.yaml 里以 `secretKeyRef` 映射成 `Redis__Password`。
# 如果反过来把 `ConnectionStrings__Default` 整个放进 Secret，同一份口令就会在
# Secret 里出现两次（`POSTGRES_PASSWORD` 与连接串内嵌的那份），
# 改口令时漏改一处 → 连接失败/认证失败，而症状看起来完全不像"漏改了一个字符串"。
#
# ⚠ 首次 apply 时必须确认的一点：k8s 对 env value 里的 `$(VAR)` 展开
#   （"dependent environment variables"）是 kubelet 的行为，本仓库
#   **没有在真实集群上验证过它**。若你的集群/校验工具不接受，
#   退路是把完整连接串直接放进 Secret 的一个键（README 里有一行命令），
#   代价就是上面说的"口令出现两处"。
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: xjgl-secret
  namespace: xjgl
  labels:
    app.kubernetes.io/name: xjgl
    app.kubernetes.io/part-of: xjgl
type: Opaque
# stringData 是给人看的明文写法，apiserver 会转成 base64 存进 data。
# 注意：**Secret 默认只是 base64，不是加密** —— 谁能读这个命名空间谁就能读到口令。
# 生产上要开 etcd 加密（EncryptionConfiguration）、限制 RBAC，并按需接外部密钥管理。
stringData:
  # 单节点冒烟用的 PostgreSQL 口令；同时被 postgres.yaml 与 api-deployment.yaml 引用
  POSTGRES_PASSWORD: "请改成强口令"
  # Redis 口令；被 redis.yaml 与 api-deployment.yaml（映射为 Redis__Password）引用
  REDIS_PASSWORD: "请改成强口令"
