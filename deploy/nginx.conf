# 河南省学籍管理系统 —— PC 端 nginx 配置
#
# 三件事必须在这里做对，否则线上会以"看起来像前端 bug"的形式暴露：
#   1. **深链回落**：前端用 history 路由，直接刷新 /student/list 会被 nginx 当成文件路径 → 404。
#   2. **上传体积**：照片上传接口允许单请求 200MB，而 nginx 默认只放行 1MB，
#      不改这里大文件会在 nginx 层被 413 拒掉（接口层的限制反而成了摆设）。
#   3. **长请求超时**：导出 zip、打印花名册都是"请求内同步生成"，可能几十秒，
#      默认 60s 超时会让用户看到"导出一半失败"。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 与 PhotosController 的 RequestSizeLimit(200MB) 对齐，留一点余量
    client_max_body_size 210m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 带内容指纹的构建产物可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 绝不能缓存：否则发版后用户拿到的还是旧壳子，引用的旧 chunk 已经不存在了
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # 后端：应用服务（/api/app/*）、照片上传与取图（/api/photos/*）、
    # 登录（/connect/token）、Swagger（/swagger）
    location ~ ^/(api|connect|swagger)/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # 导出/打印是同步生成，给足时间（同时后端也有限流兜底）
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 大文件上传时不要在 nginx 里做缓冲写盘
        proxy_request_buffering off;
    }

    # 健康检查透传（容器与负载均衡探针用）
    location = /health {
        proxy_pass http://api:8080/health;
        access_log off;
    }

    # 前端路由回落：找不到文件就交给 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}
